[project]
name = "frtb-lite-risk-engine"
version = "0.1.0"
description = "A lightweight C++/Python FRTB-inspired market-risk engine and dashboard."
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["python"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
